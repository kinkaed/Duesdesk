services:
  - type: web
    name: duesdesk
    runtime: docker
    plan: starter
    healthCheckPath: /health/
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: 8000
      - key: TRUST_PROXY
        value: "1"
      - key: TRUSTED_PROXY_IP
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
