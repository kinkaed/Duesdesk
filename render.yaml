services:
  - type: web
    name: duesdesk
    runtime: python
    plan: starter
    rootDir: .
    region: frankfurt
    healthCheckPath: /health/
    buildCommand: python -m pip install -r backend/requirements.lock && npx --yes pnpm@11.19.0 install --frozen-lockfile && npx --yes pnpm@11.19.0 run build && python backend/manage.py findstatic app.css --verbosity 2 && python backend/manage.py collectstatic --noinput --verbosity 2 && python backend/manage.py verify_static
    preDeployCommand: python backend/manage.py migrate --noinput && python backend/manage.py deployment_check
    startCommand: cd backend && python serve.py
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PORT
        value: 10000
      - key: BIND_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: TRUSTED_PROXY_IP
        value: "*"
      # Render publishes no proxy CIDR, so waitress sees only "*" and the only
      # proxy header it may honour is which protocol the ingress saw. Trusting
      # x-forwarded-for from a wildcard peer is refused by deployment_check:
      # Render appends to it, so the first value is whatever the client sent.
      - key: TRUSTED_PROXY_HEADERS
        value: x-forwarded-proto
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: duesdesk.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false