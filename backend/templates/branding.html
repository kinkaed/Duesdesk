{% if branding %}<style>:root{--org-primary:{{ branding.primary }};--org-primary-text:{{ branding.primary_text }};--org-secondary:{{ branding.secondary }};--org-secondary-text:{{ branding.secondary_text }};--org-accent:{{ branding.accent }};--org-accent-text:{{ branding.accent_text }}}.button.primary{background:var(--org-primary);color:var(--org-primary-text)}.brand-icon{background:var(--org-primary);color:var(--org-primary-text)}.login-page{background:var(--org-primary)}.receipt-total{background:var(--org-secondary);color:var(--org-secondary-text)}</style>{% if branding.logo_url %}<img src="{{ branding.logo_url }}" alt="{{ organisation.name }} logo" width="64" height="64" style="object-fit:contain">{% endif %}<p>{{ organisation.name }}</p>{% endif %}
